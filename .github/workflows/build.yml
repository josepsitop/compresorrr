name: Compilar Squeeze

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generar carpeta android
        shell: bash
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          cp -r lib /tmp/lib_bak
          flutter create --platforms=android --project-name squeeze --org com.squeeze .
          cp /tmp/pubspec.yaml pubspec.yaml
          rm -rf lib test
          cp -r /tmp/lib_bak lib
          python3 tool/patch_android.py
      - run: flutter pub get
      - name: Forzar compileSdk 36 en los plugins
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/compilesdk.gradle <<'EOF'
          allprojects {
              afterEvaluate { p ->
                  def ext = p.extensions.findByName('android')
                  if (ext != null && p.name != 'app') {
                      ext.compileSdk = 36
                  }
              }
          }
          EOF
      - run: flutter build apk --release --target-platform android-arm,android-arm64 --no-shrink
      - uses: actions/upload-artifact@v4
        with:
          name: squeeze-android
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generar carpeta windows
        shell: bash
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          cp -r lib /tmp/lib_bak
          flutter create --platforms=windows --project-name squeeze --org com.squeeze .
          cp /tmp/pubspec.yaml pubspec.yaml
          rm -rf lib test
          cp -r /tmp/lib_bak lib
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Añadir FFmpeg (NVENC, x265, SVT-AV1)
        shell: pwsh
        run: |
          $dst = "build/windows/x64/runner/Release/tools"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          Copy-Item ffmpeg_tmp/*/bin/ffmpeg.exe $dst
          Copy-Item ffmpeg_tmp/*/bin/ffprobe.exe $dst
      - name: Añadir Ghostscript y 7-Zip (opcional)
        shell: pwsh
        continue-on-error: true
        run: |
          choco install ghostscript -y --no-progress
          $dst = "build/windows/x64/runner/Release/tools"
          $gs = Get-ChildItem "C:\Program Files\gs" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          Copy-Item $gs.FullName "$dst/gs" -Recurse
          Copy-Item "C:\Program Files\7-Zip\7z.exe" $dst
          Copy-Item "C:\Program Files\7-Zip\7z.dll" $dst
      - uses: actions/upload-artifact@v4
        with:
          name: squeeze-windows
          path: build/windows/x64/runner/Release/

  package:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Crear Squeeze-Todo.zip
        run: |
          mkdir -p out
          cp dl/squeeze-android/app-release.apk out/Squeeze-Android.apk
          (cd dl/squeeze-windows && zip -r -q ../../out/Squeeze-Windows.zip .)
          (cd out && zip -q ../Squeeze-Todo.zip Squeeze-Android.apk Squeeze-Windows.zip)
      - uses: actions/upload-artifact@v4
        with:
          name: Squeeze-Todo
          path: Squeeze-Todo.zip
      - name: Publicar en Releases (solo con tag vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/Squeeze-Android.apk
            out/Squeeze-Windows.zip
